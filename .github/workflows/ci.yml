name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: compile, unit tests, integration tests against PostgreSQL ──────
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pipeline_assistant_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: pipeline-troubleshooting-assistant/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and verify with Maven
        env:
          DB_URL: jdbc:postgresql://localhost:5432/pipeline_assistant_test
          DB_USERNAME: test
          DB_PASSWORD: test
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Tests
          path: pipeline-troubleshooting-assistant/backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: pipeline-troubleshooting-assistant/backend/target/site/jacoco/
          retention-days: 30

  # ── Secret scan: grep all tracked files for hardcoded credentials ────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          FOUND=0

          # Tracked text files, excluding known-safe and intentional-pattern paths
          SCAN_FILES=$(git ls-files | grep -vE \
            '(\.env$|\.env\.example$|package-lock\.json$|yarn\.lock$|\.lock$|node_modules/|\.class$|\.jar$|\.war$|\.png$|\.jpg$|\.jpeg$|\.gif$|\.ico$|\.svg$|target/|build/|dist/|/src/test/|tests/secret-detection/|\.test\.(ts|tsx|js|jsx)$|\.spec\.(ts|tsx|js|jsx)$)' \
            || true)

          scan() {
            local name="$1"
            local pattern="$2"
            local matches

            if [ -z "$SCAN_FILES" ]; then return; fi
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              grep -qI '' "$f" 2>/dev/null || continue
              matches=$(grep -nP -e "$pattern" "$f" 2>/dev/null || true)
              if [ -n "$matches" ]; then
                echo "[SECRET DETECTED] $name — $f"
                printf '%s\n' "$matches" | sed 's/^/  /'
                FOUND=1
              fi
            done <<< "$SCAN_FILES"
          }

          scan "AWS Access Key"                  'AKIA[A-Z0-9]{16}'
          scan "Generic API/Secret Key"          '(?i)(api_key|api_secret|secret_key)\s*[=:]\s*[A-Za-z0-9_-]{20,}'
          scan "Bearer Token"                    'Bearer\s+[A-Za-z0-9._~+\/-]{20,}'
          scan "Password Assignment (quoted)"    '(?i)(password|passwd)\s*[:=]\s*[\x22\x27][^\x22\x27]{3,}[\x22\x27]'
          scan "Private Key Header"              '-----BEGIN\s*(RSA |EC |OPENSSH )?PRIVATE KEY-----'
          scan "JDBC URL with Embedded Creds"    'jdbc:[a-z]+://[^:/?]+:[^@/?]+@'

          if [ "$FOUND" -ne 0 ]; then
            echo ""
            echo "CI FAILED: hardcoded secret(s) found in tracked files."
            echo "Fix the issues above and push again."
            exit 1
          fi

          echo "Secret scan passed — no findings."

  # ── Frontend: TypeScript type-check, Vite build, Vitest unit tests ──────────
  frontend:
    name: Frontend (Node 22 / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipeline-troubleshooting-assistant/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('pipeline-troubleshooting-assistant/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Publish: build and push versioned images to ghcr.io ────────────────────
  publish:
    name: Publish Container Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend image ────────────────────────────────────────────────────────

      - name: Generate backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pipeline-assistant-backend
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: pipeline-troubleshooting-assistant/backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── Frontend image ───────────────────────────────────────────────────────

      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pipeline-assistant-frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: pipeline-troubleshooting-assistant/frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
