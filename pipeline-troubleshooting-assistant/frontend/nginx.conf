# ── Rate-limit zones (http context) ───────────────────────────────────────────
# Declared before the server block so they appear at the http context level
# (this file is included inside the http block by /etc/nginx/nginx.conf).
# Zone size 10m ≈ 160,000 unique IPs per zone — sufficient for production traffic.
# Rates expressed in requests/second; the target minutes values are:
#   auth_limit : 100 req/min → ~2r/s
#   api_limit  : 1000 req/min → ~17r/s
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=17r/s;

# Return HTTP 429 (Too Many Requests) instead of Nginx's default 503 when a
# rate limit is exceeded — 429 is the semantically correct status per RFC 6585.
limit_req_status 429;

# ── Connection-limit zone (http context) ──────────────────────────────────────
# Caps concurrent open connections per client IP to prevent connection exhaustion
# and slow-loris style attacks. 10m zone ≈ 160,000 tracked IPs.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Upstream pool with keepalive (http context) ───────────────────────────────
# Defines a named upstream so all proxy_pass directives can reuse persistent
# HTTP/1.1 connections to the backend (avoids TCP handshake on every request).
# keepalive 32: maintain up to 32 idle connections per worker in the pool.
# Adjust keepalive proportionally when the backend is scaled horizontally.
upstream backend_pool {
    server backend:8080;
    keepalive 32;
}

# ── Structured access log format (http context) ───────────────────────────────
# Fields align with common SIEM / log-aggregation expectations:
#   remote_addr, timestamp, method, URI, status, bytes, request_time (wall clock),
#   upstream_response_time (backend latency), user_agent.
# upstream_response_time is '-' for Nginx-handled requests (e.g. static files).
log_format structured
    '$remote_addr [$time_iso8601] '
    '"$request_method $request_uri" $status $body_bytes_sent '
    '$request_time $upstream_response_time '
    '"$http_user_agent"';

server {
    listen 80;
    server_name localhost;

    # Suppress Nginx version in the Server response header
    server_tokens off;

    # Reject request bodies larger than 1 MB before they reach the backend.
    client_max_body_size 1m;

    # ── Header size limits ─────────────────────────────────────────────────────
    # 4 buffers × 8k = 32k maximum for request headers.
    # Protects against header-injection and buffer-overflow probes.
    large_client_header_buffers 4 8k;

    # ── Connection limit ───────────────────────────────────────────────────────
    # Allow at most 50 concurrent connections from a single client IP.
    # Excess connections return 503; see @conn_limited named location below.
    limit_conn conn_limit 50;

    # ── Proxy buffer configuration ─────────────────────────────────────────────
    # proxy_buffer_size: buffer for the first part of the response (status line + headers).
    # proxy_buffers: 8 additional 8k buffers for the response body (64k total).
    # proxy_busy_buffers_size: max bytes that can be sent to the client while the rest
    # is still being received from the backend (must be <= proxy_buffers total).
    proxy_buffer_size 4k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;

    # ── Proxy error interception ───────────────────────────────────────────────
    # Allows the error_page directives below to handle backend 5xx responses
    # with JSON bodies instead of forwarding the raw backend error page.
    proxy_intercept_errors on;

    # Use the structured log format for all access log entries in this server block.
    access_log /var/log/nginx/access.log structured;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ───────────────────────────────────────────────────────
    # Applied to all responses from location blocks that do NOT define their own
    # add_header directives (Nginx inherits from parent if child has no add_header).
    # Location blocks that define their own add_header (static-assets, @rate_limited,
    # @conn_limited) repeat these headers explicitly — see Nginx add_header scoping rule.
    # 'always' ensures headers are sent on 4xx/5xx error responses too.
    #
    # CSP connect-src 'self' works because the API calls are proxied through
    # Nginx at /api/, so frontend and backend share the same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Error page mappings ────────────────────────────────────────────────────
    # '=' reuses the HTTP status code returned by the named location.
    error_page 429 = @rate_limited;
    error_page 413 = @body_too_large;
    error_page 503 = @conn_limited;
    error_page 502 = @bad_gateway;
    error_page 504 = @gateway_timeout;

    # ── Gzip compression ───────────────────────────────────────────────────────
    # Enabled for API and text content to reduce bandwidth.
    # gzip_min_length 256: skip tiny responses where compression adds overhead.
    # gzip_vary on: adds Vary: Accept-Encoding so proxies cache compressed/plain
    # versions separately.
    # gzip_proxied any: compress responses for proxied requests too.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # ── Health check — no rate limiting, no connection limit ──────────────────
    # Used by monitoring systems (e.g., ALB health checks, Prometheus, uptime bots).
    # Proxied to the Spring Boot Actuator /actuator/health endpoint.
    # access_log off: prevents health poll noise from polluting operational logs.
    location /health {
        access_log off;
        proxy_pass http://backend_pool/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
    }

    # ── Auth API — tight rate limit ────────────────────────────────────────────
    # 100 req/min per IP (rate=2r/s), burst allows up to 10 requests
    # to be served immediately before limiting begins (nodelay = no queuing).
    # Must be ordered before /api/ so /api/auth/* is matched by the more
    # specific prefix first.
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # ── General API — standard rate limit ─────────────────────────────────────
    # 1000 req/min per IP (rate=17r/s), burst allows up to 50 requests
    # to be served immediately before limiting begins.
    # proxy_read_timeout 30s: sufficient for cold-cache analysis (<500ms p95)
    # while still protecting against hung backend connections.
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # ── SPA routing ────────────────────────────────────────────────────────────
    # Static assets are NOT rate limited — avoids degrading user experience
    # when the browser loads multiple resources in parallel on page load.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for versioned static assets (Vite includes content hash
    # in filenames). Security headers are repeated here because this location's
    # own add_header directives would suppress inheritance from the server block
    # (Nginx add_header scoping rule — ngx_http_headers_module).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # ── Named error locations ──────────────────────────────────────────────────
    # These named locations must repeat security headers because defining any
    # add_header here suppresses inheritance from the server block.

    # 429 Too Many Requests — rate limit exceeded
    location @rate_limited {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Retry-After 60 always;
        return 429 '{"message":"Too many requests. Please try again later.","status":429}';
    }

    # 413 Request Entity Too Large — body exceeds client_max_body_size
    # No add_header here — inherits security headers from the server block.
    location @body_too_large {
        default_type application/json;
        return 413 '{"message":"Request body too large. Maximum size is 1MB.","status":413}';
    }

    # 503 Service Unavailable — connection limit per IP exceeded
    location @conn_limited {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 503 '{"message":"Too many concurrent connections. Please try again shortly.","status":503}';
    }

    # 502 Bad Gateway — backend is unreachable or returned an invalid response
    location @bad_gateway {
        default_type application/json;
        return 502 '{"message":"Backend service is temporarily unavailable. Please try again.","status":502}';
    }

    # 504 Gateway Timeout — backend did not respond within the timeout window
    location @gateway_timeout {
        default_type application/json;
        return 504 '{"message":"Backend service timed out. Please try again.","status":504}';
    }
}
