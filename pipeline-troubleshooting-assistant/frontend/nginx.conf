server {
    listen 80;
    server_name localhost;

    # Suppress Nginx version in the Server response header
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ───────────────────────────────────────────────────────
    # Applied to all responses from the / and /api/ location blocks.
    # The static-assets location block below repeats these headers because Nginx
    # does not inherit add_header from a parent block once the child block defines
    # its own add_header directive (Nginx 1.7.5+ — see ngx_http_headers_module).
    # 'always' ensures headers are sent on 4xx/5xx error responses too.
    #
    # CSP rationale:
    #   script-src 'self'            — blocks inline scripts and cross-origin JS
    #   style-src 'self' 'unsafe-inline' — required for inline styles (React / CSS-in-JS)
    #   img-src  'self' data:        — allows base64-encoded images
    #   connect-src 'self'           — API calls go through the Nginx /api/ reverse proxy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression for text-based assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA routing — unmatched paths fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (by docker-compose service name)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-lived cache for versioned static assets (Vite includes content hash in filenames).
    # Security headers are repeated here because this location's own add_header directives
    # would suppress inheritance from the server block (Nginx add_header scoping rule).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
