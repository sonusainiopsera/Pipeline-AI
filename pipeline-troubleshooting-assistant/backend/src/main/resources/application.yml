spring:
  application:
    name: pipeline-assistant
  datasource:
    # Resolved from environment variable; default is LOCAL-DEVELOPMENT-ONLY
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipelinedb}
    username: ${DB_USERNAME:localdev}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-request-size: 2MB
      max-file-size: 2MB

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 2MB

app:
  cors:
    # Resolved from environment variable; default is LOCAL-DEVELOPMENT-ONLY
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
