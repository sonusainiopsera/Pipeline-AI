spring:
  application:
    name: pipeline-assistant
  datasource:
    # Resolved from environment variable; default is LOCAL-DEVELOPMENT-ONLY
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipelinedb}
    username: ${DB_USERNAME:localdev}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
  jpa:
    # ddl-auto is profile-specific: 'update' in dev (application-dev.yml), 'validate' in prod (application-prod.yml)
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Prevents DROP/recreate of the entire schema — always disabled regardless of profile
    clean-disabled: true
    locations: classpath:db/migration
    # Allows Flyway to baseline an existing database that pre-dates Flyway adoption
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-request-size: 2MB
      max-file-size: 2MB

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 2MB

app:
  cors:
    # Resolved from environment variable; default is LOCAL-DEVELOPMENT-ONLY
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

analysis:
  scoring:
    base-confidence: 55
    scaling-factor: 43
    max-confidence: 98
    unclassified-confidence: 20
  response:
    template: "We have identified the root cause of your pipeline failure as: {rootCause}. We recommend the following action: {suggestedFix}"
    unclassified-message: "We are investigating the pipeline failure and will provide an update shortly."

cache:
  knowledge-base:
    ttl-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  metrics:
    tags:
      application: pipeline-assistant
    distribution:
      percentiles-histogram:
        analysis.duration: true
