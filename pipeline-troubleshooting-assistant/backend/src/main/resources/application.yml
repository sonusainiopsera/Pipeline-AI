spring:
  application:
    name: pipeline-assistant
  datasource:
    # Resolved from environment variable; default is LOCAL-DEVELOPMENT-ONLY
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipelinedb}
    username: ${DB_USERNAME:localdev}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
  jpa:
    # ddl-auto is profile-specific: 'update' in dev (application-dev.yml), 'validate' in prod (application-prod.yml)
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Prevents DROP/recreate of the entire schema — always disabled regardless of profile
    clean-disabled: true
    locations: classpath:db/migration
    # Allows Flyway to baseline an existing database that pre-dates Flyway adoption
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-request-size: 2MB
      max-file-size: 2MB
  output:
    ansi:
      enabled: NEVER

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 2MB

app:
  cors:
    # Resolved from environment variable; default is LOCAL-DEVELOPMENT-ONLY
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  base-url: ${APP_BASE_URL:http://localhost:8080}

analysis:
  scoring:
    base-confidence: 55
    scaling-factor: 43
    max-confidence: 98
    unclassified-confidence: 20
  response:
    template: "We have identified the root cause of your pipeline failure as: {rootCause}. We recommend the following action: {suggestedFix}"
    unclassified-message: "We are investigating the pipeline failure and will provide an update shortly."

cache:
  knowledge-base:
    ttl-minutes: 10

jwt:
  # Placeholder values — override with real secrets via environment variables in production.
  # secret must be at least 256 bits (32 bytes) for HS256; use a strong random value.
  secret: ${JWT_SECRET:placeholder-secret-key-replace-in-production-must-be-256-bits-minimum}
  # Token lifetimes in seconds
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400}

retention:
  # Retention period for analyzed_logs: records older than this are purged daily at 02:00 UTC.
  analyzed-logs-days: 90
  # Retention period for audit_logs: records older than this are purged in the same daily run.
  audit-logs-days: 365

logging:
  level:
    com.opsera.pipelineassistant: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,caches
  metrics:
    tags:
      application: pipeline-assistant
    distribution:
      percentiles-histogram:
        analysis.duration: true
