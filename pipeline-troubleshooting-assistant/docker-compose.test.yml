# Docker Compose override for off-site backup integration testing.
# Use with: docker compose -f docker-compose.yml -f docker-compose.test.yml <command>
#
# Adds a MinIO service as a local S3-compatible store and injects S3
# environment variables into the backup service. Never use in production.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: pipeline-backups-test
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      REMOTE_RETENTION_DAYS: 90
      PUSH_TIMEOUT_SECONDS: 30
      BACKUP_S3_AUTO_CREATE_BUCKET: "true"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data:
